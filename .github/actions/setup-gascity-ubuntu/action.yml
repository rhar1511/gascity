name: Setup Gas City Ubuntu CI
description: Install the shared Ubuntu dependencies for Gas City CI jobs

inputs:
  go-version:
    description: >-
      Go version to install. Empty (the default) reads the version from go.mod,
      so the toolchain can never skew from the module directive. Pass an
      explicit version only to test against a different toolchain.
    required: false
    default: ""
  node-version:
    description: Node.js version to install
    required: false
    default: "22"
  dolt-version:
    description: Dolt version to install
    required: true
  bd-version:
    description: >-
      Beads release version to install. Empty string means the caller builds or
      installs bd itself (used by the cross-version contract "current" cell).
    required: false
    default: ""
  qualified-integration-bd:
    description: Build the authenticated released CLI paired with the native Go library
    required: false
    default: "false"
  process-build-cache:
    description: Prepare or require this run's exact-source native process build cache
    required: false
    default: ""
  install-claude-cli:
    description: Whether to install the Claude CLI
    required: false
    default: "true"
  claude-version:
    description: Claude Code version to install with the native binary installer
    required: false
    default: "2.1.123"

outputs:
  process-cache-key:
    description: Exact source, run, platform and Go version cache key
    value: ${{ steps.process-cache.outputs.key }}
  process-cache-path:
    description: Selected Go build cache directory
    value: ${{ steps.process-cache.outputs.path }}
  process-cache-hit:
    description: Whether the exact prepared cache was restored
    value: ${{ steps.restore-process-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y tmux jq

    - name: Install dolt v${{ inputs.dolt-version }}
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-dolt-archive.sh "${{ inputs.dolt-version }}"

    - name: Install released bd v${{ inputs.bd-version }}
      # Skip when no version is given: the contract cross-version "current" cell
      # builds bd from source instead of installing a released tarball.
      if: ${{ inputs.bd-version != '' }}
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-bd-archive.sh "${{ inputs.bd-version }}"

    - name: Declare the installed bd integration-test executable
      if: ${{ inputs.bd-version != '' }}
      shell: bash
      run: |
        set -euo pipefail
        bd_expected_binary="${BD_INSTALL_BIN_DIR:-/usr/local/bin}/bd"
        bd_test_binary="$(command -v bd)"
        [[ "$bd_test_binary" = /* && -f "$bd_test_binary" && -x "$bd_test_binary" && "$bd_test_binary" == "$bd_expected_binary" ]] || {
          echo "The selected bd executable must be the binary installed by this setup action" >&2
          exit 1
        }
        case "$bd_test_binary" in
          *$'\n'*|*$'\r'*) echo "bd test executable path contains a line break" >&2; exit 1 ;;
        esac
        printf 'BEADS_TEST_BD_BINARY=%s\nBEADS_TEST_UPSTREAM_BD_BINARY=%s\n' "$bd_test_binary" "$bd_test_binary" >> "$GITHUB_ENV"

    - name: Install qualified Beads build dependencies
      if: ${{ inputs.qualified-integration-bd == 'true' }}
      shell: bash
      run: sudo apt-get install -y libicu-dev pkg-config

    - name: Resolve native process build cache
      id: process-cache
      if: ${{ inputs.process-build-cache != '' }}
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.process-build-cache }}
        NATIVE_PAIR: ${{ inputs.qualified-integration-bd }}
        SOURCE_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: |
        set -euo pipefail
        [[ "$CACHE_MODE" == prepare || "$CACHE_MODE" == require ]]
        [[ "$NATIVE_PAIR" == true && "$PLATFORM" == Linux-X64 ]]
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
        cache_path="$(go env GOCACHE)"
        go_version="$(go env GOVERSION)"
        [[ "$cache_path" == /* && "$cache_path" != *$'\n'* && "$cache_path" != *$'\r'* ]]
        [[ "$go_version" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'key=gc-process-v1-%s-%s-%s-%s\npath=%s\n' "$PLATFORM" "$go_version" "$SOURCE_SHA" "$RUN_ID" "$cache_path" >> "$GITHUB_OUTPUT"

    - name: Restore prepared native process build cache
      id: restore-process-cache
      if: ${{ inputs.process-build-cache != '' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: ${{ steps.process-cache.outputs.key }}
        path: ${{ steps.process-cache.outputs.path }}
        fail-on-cache-miss: ${{ inputs.process-build-cache == 'require' }}

    - name: Require exact prepared process cache before building
      if: ${{ inputs.process-build-cache == 'require' }}
      shell: bash
      env:
        EXACT_CACHE_HIT: ${{ steps.restore-process-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        [[ "$EXACT_CACHE_HIT" == true ]]

    - name: Install qualified integration bd
      if: ${{ inputs.qualified-integration-bd == 'true' }}
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-qualified-integration-bd.sh

    - name: Install Claude CLI
      if: ${{ inputs.install-claude-cli == 'true' }}
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-claude-native.sh "${{ inputs.claude-version }}"
