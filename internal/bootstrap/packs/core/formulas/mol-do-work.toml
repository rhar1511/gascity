description = """
Simple work formula — read the bead, do what it says, close it.

This is the minimal work lifecycle for coding agents. No git branching,
no worktree isolation, no refinery handoff. The agent reads the bead's
description, implements the solution in the current working directory,
and closes the bead when done.

Use this for demos and simple single-agent workflows. For production
multi-agent setups with worktree isolation, use mol-polecat-commit
instead (or mol-polecat-work from the gastown pack for full refinery
review).

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy_id | runtime | Input convoy tracking the single work bead |
| escalation_target | caller / rig `formula_vars` | Mail recipient for blocked work (default: `human`) |
"""
formula = "mol-do-work"

[requires]
formula_compiler = ">=2.0.0"

[vars.escalation_target]
description = """
Mail recipient for escalations when work cannot be completed. Defaults to the
reserved `human` alias, which resolves in every city. Cities that staff a
work-health role (e.g. the gastown pack's witness) can point this at it, for
example `escalation_target = "<rig>/witness"`.
"""
default = "human"

[[steps]]
id = "do-work"
title = "Read assignment, implement, verify, commit, and close"
description = """
You have been assigned a work bead. Read it, do the work, verify it,
commit relevant changes, and close it.

**1. Read your assignment:**

Derive the work bead from the input convoy, then read it:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-do-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json) || exit 1
WORK_STORE_REF=$(printf '%s' "$WORK_JSON" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_store_ref"] // empty')
PROTECTED_WORK=$(printf '%s' "$WORK_JSON" | jq -r '(if type == "array" then .[0] else . end) | [(.metadata["gc.lifecycle.transition_head.v1"] // ""), (.metadata["gc.lifecycle.admission_receipt.v2"] // ""), (.metadata["gc.lifecycle.admission_receipt.v1"] // "")] | any(. != "")')
gc bd show "$WORK_BEAD_ID"
```

Read the bead's title and description carefully. This is your task.

**Claim the source:** use the recorded lifecycle path before editing:
```bash
if [ "$PROTECTED_WORK" = "true" ]; then
  [ -n "$WORK_STORE_REF" ] || exit 1
  gc hook begin-source "$WORK_BEAD_ID" --store-ref "$WORK_STORE_REF" || exit 1
else
  gc bd update "$WORK_BEAD_ID" --claim || exit 1
  gc bd heartbeat "$WORK_BEAD_ID" || exit 1
fi
```
For ordinary work, repeat its heartbeat before long builds or tests. Protected
work retains the persisted execution-step claim; its controller verifies the
managed session and exact source. If a protected operation refuses, preserve the
work and report the refusal through the configured escalation route. Generic
claim, heartbeat, or metadata writes cannot replace a protected transition.

**2. Implement the solution and verify it:**

Do exactly what the bead describes. Follow existing codebase conventions.
Run the verification commands requested by the bead. If the bead does not
name verification commands, run the smallest relevant local test/build check
you can identify.

Before closing, inspect the working tree:
```bash
git status --short
```

If you changed product/source files, documentation, tests, configs, or other
repo-owned artifacts for the task, commit those changes before closing the bead:
```bash
git add <files>
git commit -m "<type>: <description>"
```

Do not commit unrelated runtime metadata, local agent directories, caches, or
bead database churn unless the bead explicitly required those files. If the
only remaining dirty files are unrelated runtime/bead metadata, leave them
uncommitted and mention that in your close notes.

**3. Close the target bead when done:**

Record the typed work-record outcome (ADR-0009) on the work bead so eval and
audit can trace work → artifact → outcome. Choose `gc.work_outcome` from what
actually happened:
- `shipped` — you committed a change that satisfies the bead. Supply `gc.work_commit`
  (the SHA) and `gc.work_branch` (the branch it is on).
- `no-op` — the bead needed no change (already satisfied / duplicate); omit
  `gc.work_commit` and `gc.work_branch`.
- `blocked` / `abandoned` — you could not complete it (also mail `{{escalation_target}}`).

`gc.outcome=pass` stays — it is the control-plane step result and is disjoint
from `gc.work_outcome`.

**Protected source** (`PROTECTED_WORK=true`): prepare an unsigned draft after
verification. Set `DELIVERABLE_REF` to the delivered artifact or no-op explanation, and set
`VERIFICATION_REF` to the saved verification evidence. For a shipped result:
```bash
COMMIT=$(git rev-parse HEAD) || exit 1
WORK_BRANCH=$(git rev-parse --abbrev-ref HEAD) || exit 1
[ "$WORK_BRANCH" != "HEAD" ] || exit 1
DRAFT_DIR=$(mktemp -d -p "${TMPDIR:-/var/tmp}" gc-acceptance.XXXXXX) || exit 1
gc beads completion prepare "$WORK_BEAD_ID" --store-ref "$WORK_STORE_REF" \
  --deliverable-ref "$DELIVERABLE_REF" --verification-ref "$VERIFICATION_REF" \
  --work-outcome shipped --work-commit "$COMMIT" --work-branch "$WORK_BRANCH" \
  --work-verification "<commands you ran>" > "$DRAFT_DIR/completion.json" || exit 1
```
For a no-op, omit `--work-commit` and `--work-branch` and use
`--work-outcome no-op`. For blocked or abandoned work, report the blocker and
retain the current work until the acceptance authority reviews its disposition.

Request review through the configured operator workflow. The acceptance
authority named in admission signs the reviewed draft with
`gc beads completion accept <draft-path> --store-ref <exact-store>
--key-file <owner-only-acceptance-key>`. Keep signing keys with that authority.
The operator retains the original draft for exact retries. A prepared draft is
not completion: require the successful acceptance result and closed source
readback before proceeding to step 4. Protected work skips the ordinary writes
below; the signed acceptance records its typed work record atomically.

**Ordinary source** (`PROTECTED_WORK=false`) uses the following close commands.

**Shipped** (you committed a change):
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
WORK_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
[ "$WORK_BRANCH" = "HEAD" ] && WORK_BRANCH=""   # detached HEAD — no stable branch
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --set-metadata gc.work_branch="$WORK_BRANCH" \
  --set-metadata gc.work_verification="<commands you ran>" \
  --status=closed \
  --append-notes "Done: <brief summary of what you did>. Verification: <commands run>. Commit: ${COMMIT:-none}."
```

**No-op** (the bead needed no change — already satisfied / duplicate):
```bash
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=no-op \
  --status=closed \
  --append-notes "No-op: <why no change was needed>."
```
For `blocked` / `abandoned`, use that value for `gc.work_outcome` and also mail
`{{escalation_target}}`.

**4. Close this formula step:**

Resolve the current claimed step from persisted session state. The protected
path completes it only after the source acceptance above has closed the source:
```bash
STEP_ID=$(gc hook current --id-only) || exit 1
if [ "$PROTECTED_WORK" = "true" ]; then
  [ -n "$STEP_ID" ] && [ "$STEP_ID" != "$WORK_BEAD_ID" ] || exit 1
  SOURCE_STATE=$(gc bd show "$WORK_BEAD_ID" --json) || exit 1
  [ "$(printf '%s' "$SOURCE_STATE" | jq -r '(if type == "array" then .[0] else . end) | .status')" = "closed" ] || exit 1
  gc hook complete --store-ref "$WORK_STORE_REF" --outcome pass || exit 1
else
  STEP_ID="${STEP_ID:-${GC_BEAD_ID:-}}"
  if [ -n "$STEP_ID" ] && [ "$STEP_ID" != "$WORK_BEAD_ID" ]; then
    gc bd update "$STEP_ID" --set-metadata gc.outcome=pass --status=closed --notes "Target $WORK_BEAD_ID completed. Commit: ${COMMIT:-none}." || exit 1
  fi
fi
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** The work described in the bead is complete, relevant changes
are committed, the target bead is closed, and the claimed formula step is
closed before claiming the next step."""

[[steps]]
id = "drain"
title = "Close drain step and signal completion"
needs = ["do-work"]
description = """
Work is done. Close this drain step, then signal the controller to reclaim this
session:

```bash
DRAIN_BEAD_ID=""
ROOT_BEAD_ID=""
CURRENT_ID=$(gc hook current --id-only 2>/dev/null || true)
if [ -n "$CURRENT_ID" ]; then
  CURRENT=$(gc bd show "$CURRENT_ID" --json) || exit 1
  DRAIN_BEAD_ID=$(printf '%s' "$CURRENT" | jq -r '(if type == "array" then .[0] else . end) | select(.status != "closed") | select(.metadata["gc.step_ref"] == "mol-do-work.drain") | .id // empty')
  ROOT_BEAD_ID=$(printf '%s' "$CURRENT" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_bead_id"] // empty')
fi
if [ -z "$DRAIN_BEAD_ID" ]; then
  if [ -z "$ROOT_BEAD_ID" ]; then
    STARTUP_BEAD_ID="${GC_BEAD_ID:-${GC_TRIGGER_BEAD_ID:-}}"
    if [ -z "$STARTUP_BEAD_ID" ]; then
      echo "mol-do-work drain resolved no continuation from the current claim and has no startup bead id to fall back on" >&2
      exit 1
    fi
    STARTUP_BEAD=$(gc bd show "$STARTUP_BEAD_ID" --json) || exit 1
    ROOT_BEAD_ID=$(printf '%s' "$STARTUP_BEAD" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_bead_id"] // empty')
  fi
  if [ -z "$ROOT_BEAD_ID" ]; then
    echo "mol-do-work drain could not resolve its workflow root from the current claim or a startup bead id" >&2
    exit 1
  fi
  READY_BEADS=$(gc ready --json --limit=2 --include-ephemeral --metadata-field "gc.root_bead_id=$ROOT_BEAD_ID" --metadata-field "gc.step_ref=mol-do-work.drain") || exit 1
  DRAIN_BEAD_ID=$(printf '%s' "$READY_BEADS" | jq -r 'if length == 1 then .[0].id else empty end')
  if [ -z "$DRAIN_BEAD_ID" ]; then
    echo "mol-do-work drain could not resolve one ready continuation bead for root $ROOT_BEAD_ID" >&2
    exit 1
  fi
fi
DRAIN_JSON=$(gc bd show "$DRAIN_BEAD_ID" --json) || exit 1
DRAIN_HEAD=$(printf '%s' "$DRAIN_JSON" | jq -r '(if type == "array" then .[0] else . end) | (.metadata["gc.lifecycle.transition_head.v1"] // "") + (.metadata["gc.lifecycle.materialization.v1"] // "")')
if [ -n "$DRAIN_HEAD" ]; then
  DRAIN_STORE_REF=$(printf '%s' "$DRAIN_JSON" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_store_ref"] // empty')
  [ -n "$DRAIN_STORE_REF" ] || exit 1
  if [ "$(gc hook current --id-only)" != "$DRAIN_BEAD_ID" ]; then
    gc hook --claim --json || exit 1
  fi
  [ "$(gc hook current --id-only)" = "$DRAIN_BEAD_ID" ] || exit 1
  gc hook complete --store-ref "$DRAIN_STORE_REF" --outcome pass || exit 1
else
  gc bd update "$DRAIN_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Drain acknowledged." || exit 1
fi
gc runtime drain-ack
```

Run exactly these commands and nothing else."""
