# Bounded recursive self-improvement workflow.
# The formula produces an auditable candidate and gate decision; it never
# mutates a rig root or lets the improver approve its own revision.
formula = "mol-rsi-candidate"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.objective]
description = "Explicit improvement objective and stop condition"
required = true

[vars.work_dir]
description = "Bead-specific isolated worktree path"
required = true

[vars.rig_root]
description = "Clean rig root; candidate work must never run here"
required = true

[vars.current_bundle_id]
description = "Accepted bundle ID used as the rollback target"
required = true

[vars.eval_suite_hash]
description = "Frozen evaluation suite identity"
required = true

[vars.improver_target]
description = "Candidate-producing agent target"
required = true

[vars.correctness_target]
description = "Independent correctness and safety judge target"
required = true

[vars.performance_target]
description = "Independent performance and cost judge target"
required = true

[[steps]]
id = "produce-candidate"
title = "Produce a bounded candidate in its bead worktree"
metadata = { "gc.run_target" = "{{improver_target}}", "gc.rsi_role" = "improver", "gc.rsi_work_dir" = "{{work_dir}}", "gc.rsi_parent_bundle" = "{{current_bundle_id}}", "gc.rsi_eval_suite" = "{{eval_suite_hash}}", "gc.output_json_schema" = "rsi.candidate-proposal.v1", "gc.output_json_required" = "true" }
description = """
Work only in bead-specific worktree `{{work_dir}}`. Refuse to run when
`{{work_dir}}` is the rig root `{{rig_root}}`, and do not change the rig root.
Implement the explicit objective `{{objective}}` with a fixed maximum of three
candidate attempts. Commit the candidate worktree and record the exact commit
SHA for every changed rig. Emit a revision bundle with `id`, `types`, `ai`,
`frontend`, `inktree`, `evals`, and `parent`; `parent` must equal
`{{current_bundle_id}}` and `evals` must equal `{{eval_suite_hash}}`.

You may run tests and benchmarks while developing, but your estimates are not
promotion evidence. Do not edit evaluation criteria, safety thresholds, or
promotion policy. Persist only the proposed exact bundle as
`gc.output_json` using `rsipolicy.CandidateProposal` JSON with a `candidate`
field. A separately controlled evaluator measures the candidate after both
judge lanes finish.
"""

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "judge-correctness"
title = "Independent correctness and safety review"
needs = ["produce-candidate"]
metadata = { "gc.run_target" = "{{correctness_target}}", "gc.rsi_role" = "judge", "gc.rsi_judge_kind" = "correctness", "gc.output_json_schema" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }
description = """
Review the candidate bundle from `produce-candidate` in read-only mode. You
are independent of the improver and must not modify files, evaluation criteria,
limits, or the candidate. You may read public policy and criteria, but may not
read held-out evaluation data, controller configuration, or signing keys.
Validate correctness, safety behavior, dependency
changes, and the frozen regression suite. Record evidence and a structured lane
output using `reviewquorum.LaneOutput` JSON with verdict `pass`, `pass_with_findings`, `fail`, or `blocked`.
"""

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "judge-performance"
title = "Independent performance and cost review"
needs = ["produce-candidate"]
metadata = { "gc.run_target" = "{{performance_target}}", "gc.rsi_role" = "judge", "gc.rsi_judge_kind" = "performance", "gc.output_json_schema" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }
description = """
Review the candidate bundle from `produce-candidate` in read-only mode. You
are independent of the improver and correctness judge. Measure latency, cost,
resource use, and dependency limits. You may read public policy and criteria,
but may not read held-out evaluation data, controller configuration, or signing
keys. Do not change thresholds or evaluation criteria. Record evidence and a structured
lane output using `reviewquorum.LaneOutput` JSON with verdict `pass`, `pass_with_findings`, `fail`, or `blocked`.
"""

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "promote-gate"
title = "Finalize quorum and apply the monotonic promotion gate"
needs = ["produce-candidate", "judge-correctness", "judge-performance"]
metadata = { "gc.kind" = "rsi-promotion-gate", "gc.rsi_role" = "gate", "gc.rsi_policy" = "internal/rsipolicy.Evaluate", "gc.output_json_schema" = "rsi.decision.v1", "gc.output_json_required" = "true" }
description = """
The controller loads the candidate proposal and both durable judge outputs,
then resolves a signed evaluation manifest from root city `[rsi]` config. The
manifest is created by an evaluator that runs outside the improver and judges,
uses a key they cannot access, and binds their actual assigned actors/sessions
and permission profiles. It records independently measured baseline/candidate
metrics, approved limits, the fixed acceptance-unit set and results, worker-time
ledgers, the frozen suite, bundle lineage, and judge output digests. Candidate
reported metrics, limits, attempts, and authority labels have no policy effect.
The Go review finalizer synthesizes the judge lanes before `Evaluate` runs.

Promote only when the trusted measurements improve strictly, both independent
judge lanes pass, every safety/resource limit holds, the candidate differs
from its accepted baseline, suite and parent identities match, the bounded
attempt budget remains, and a human signature approves this exact evaluation
manifest, candidate bead, bundles, suite, and policy version. First promotion
always requires a separate human key. Persist the decision and rollback bundle
ID as `gc.output_json`. A failed or blocked cycle is evidence for the next
proposal; never recursively modify the evaluator or its criteria.
"""
