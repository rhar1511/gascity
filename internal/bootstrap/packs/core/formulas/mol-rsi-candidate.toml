# Bounded recursive self-improvement workflow.
# The formula produces an auditable candidate and gate decision; it never
# mutates a rig root or lets the improver approve its own revision.
formula = "mol-rsi-candidate"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.objective]
description = "Explicit improvement objective and stop condition"
required = true

[vars.work_dir]
description = "Bead-specific isolated worktree path"
required = true

[vars.rig_root]
description = "Clean rig root; candidate work must never run here"
required = true

[vars.current_bundle_id]
description = "Accepted bundle ID used as the rollback target"
required = true

[vars.eval_suite_hash]
description = "Frozen evaluation suite identity"
required = true

[vars.improver_target]
description = "Candidate-producing agent target"
required = true

[vars.correctness_target]
description = "Independent correctness and safety judge target"
required = true

[vars.performance_target]
description = "Independent performance and cost judge target"
required = true

[vars.authority_class]
description = "optimization, workflow, world_model, evaluator, safety_policy, clinical, deployment, or deployment_policy"
default = "optimization"

[[steps]]
id = "produce-candidate"
title = "Produce a bounded candidate in its bead worktree"
metadata = { "gc.run_target" = "{{improver_target}}", "gc.rsi_role" = "improver", "gc.rsi_work_dir" = "{{work_dir}}", "gc.rsi_parent_bundle" = "{{current_bundle_id}}", "gc.rsi_eval_suite" = "{{eval_suite_hash}}", "gc.output_json_schema" = "rsi.candidate.v1", "gc.output_json_required" = "true" }
description = """
Work only in bead-specific worktree `{{work_dir}}`. Refuse to run when
`{{work_dir}}` is the rig root `{{rig_root}}`, and do not change the rig root.
Implement the explicit objective `{{objective}}` with a fixed maximum of three
candidate attempts. Commit the candidate worktree and record the exact commit
SHA for every changed rig. Emit a revision bundle with `id`, `types`, `ai`,
`frontend`, `inktree`, `evals`, and `parent`; `parent` must equal
`{{current_bundle_id}}` and `evals` must equal `{{eval_suite_hash}}`.

Run the frozen regression suite and bounded benchmark suite. Report baseline
and candidate metrics for quality score, safety score, latency, cost, and
new dependency count. Do not edit evaluation criteria, safety thresholds,
or promotion policy. Persist the candidate bundle, metrics, commands, and
failure evidence as `gc.output_json` using `rsipolicy.CandidateEvidence` JSON.
"""

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "judge-correctness"
title = "Independent correctness and safety review"
needs = ["produce-candidate"]
metadata = { "gc.run_target" = "{{correctness_target}}", "gc.rsi_role" = "judge", "gc.rsi_judge_kind" = "correctness", "gc.output_json_schema" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }
description = """
Review the candidate bundle from `produce-candidate` in read-only mode. You
are independent of the improver and must not modify files, evaluation criteria,
limits, or the candidate. Validate correctness, safety behavior, dependency
changes, and the frozen regression suite. Record evidence and a structured lane
output using `reviewquorum.LaneOutput` JSON with verdict `pass`, `pass_with_findings`, `fail`, or `blocked`.
"""

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "judge-performance"
title = "Independent performance and cost review"
needs = ["produce-candidate"]
metadata = { "gc.run_target" = "{{performance_target}}", "gc.rsi_role" = "judge", "gc.rsi_judge_kind" = "performance", "gc.output_json_schema" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }
description = """
Review the candidate bundle from `produce-candidate` in read-only mode. You
are independent of the improver and correctness judge. Measure latency, cost,
resource use, and dependency limits against the recorded baseline. Do not
change thresholds or evaluation criteria. Record evidence and a structured
lane output using `reviewquorum.LaneOutput` JSON with verdict `pass`, `pass_with_findings`, `fail`, or `blocked`.
"""

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "promote-gate"
title = "Finalize quorum and apply the monotonic promotion gate"
needs = ["judge-correctness", "judge-performance"]
metadata = { "gc.kind" = "rsi-promotion-gate", "gc.rsi_role" = "gate", "gc.rsi_policy" = "internal/rsipolicy.Evaluate", "gc.output_json_schema" = "rsi.decision.v1", "gc.output_json_required" = "true", "gc.rsi_authority_class" = "{{authority_class}}" }
description = """
Load the candidate bundle, metrics, and both durable judge lane outputs. The
candidate step must emit `rsipolicy.CandidateEvidence` JSON and each judge step
must emit `reviewquorum.LaneOutput` JSON. The Go review finalizer must synthesize the lane outputs before the promotion gate
runs. Build the policy input for `internal/rsipolicy.Evaluate` with the current
bundle as the rollback target, the frozen evaluation suite hash, the explicit
objective, and the bounded attempt count.

Promote only when the candidate strictly improves the baseline score, passes
both independent judge lanes, satisfies every safety, latency, cost, and
dependency limit, preserves parent/evaluation-suite identity, and remains
within the maximum attempt budget. Persist the decision, stable failure
reasons, evidence, and rollback bundle ID as `gc.output_json`.

For authority class `evaluator`, `safety_policy`, `clinical`, `deployment`, `deployment_policy`, or `world_model`,
stop at a human approval gate even when the policy decision passes. Formatting,
administrative, and ordinary optimization changes may proceed automatically
only when the policy decision passes. A failed or blocked cycle is evidence for
the next proposal; never recursively modify the evaluator or its criteria.
"""

[steps.retry]
max_attempts = 1
on_exhausted = "hard_fail"
