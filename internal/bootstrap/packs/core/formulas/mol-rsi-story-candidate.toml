# Story-traceable RSI variant. The generic RSI policy remains product-neutral;
# the project supplies its frozen suite and independently captured traces.
formula = "mol-rsi-story-candidate"
extends = ["mol-rsi-candidate"]

[requires]
formula_compiler = ">=2.0.0"

[vars.story_suite_path]
description = "Path to the frozen user-story benchmark suite whose SHA-256 is eval_suite_hash"
required = true

[vars.benchmark_target]
description = "Independent harness operator; must differ from improver_target"
required = true

[vars.benchmark_command]
description = "Pinned absolute path to the rsistorybench binary on the judge host"
required = true

[vars.authority_class]
description = "Explicit candidate authority class; sensitive classes require human approval"
required = true

[[steps]]
id = "judge-story-benchmark"
title = "Run the frozen user-story action benchmark"
needs = ["produce-candidate"]
metadata = { "gc.run_target" = "{{benchmark_target}}", "gc.rsi_role" = "benchmark", "gc.rsi_suite_path" = "{{story_suite_path}}", "gc.rsi_eval_suite" = "{{eval_suite_hash}}", "gc.output_json_schema" = "rsi.story-evidence.v1", "gc.output_json_required" = "true" }
description = """
Use a read-only checkout and a harness independent of `{{improver_target}}`.
Load frozen suite `{{story_suite_path}}` and verify its raw SHA-256 equals
`{{eval_suite_hash}}`. Replay the same cases against the accepted and candidate
revision bundles. Capture typed actions from the workflow harness; never accept
candidate-authored scores or action lists as observations. Keep raw sensitive
user text out of the result artifact.

Run `{{benchmark_command}} --suite <suite> --baseline <accepted-trace.json>
--candidate <candidate-trace.json> --improver <improver-id> --out <result.json>
--evidence-out <evidence.json>`.
Persist the exact `storybench.Evidence` JSON from `evidence.json` as
`gc.output_json`. The Go promotion gate recomputes the result from these traces
and the pinned suite; it does not trust a worker-authored pass/fail score.
If the harness cannot capture a trace or the benchmark is ineligible, preserve
that failure evidence. Do not change the frozen suite or thresholds.
"""

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "promote-gate"
title = "Finalize quorum, story benchmark, and RSI promotion"
needs = ["judge-correctness", "judge-performance", "judge-story-benchmark"]
metadata = { "gc.kind" = "rsi-promotion-gate", "gc.rsi_role" = "gate", "gc.rsi_policy" = "internal/rsipolicy.Evaluate", "gc.rsi_story_benchmark_required" = "true", "gc.rsi_suite_path" = "{{story_suite_path}}", "gc.rsi_eval_suite" = "{{eval_suite_hash}}", "gc.rsi_parent_bundle" = "{{current_bundle_id}}", "gc.output_json_schema" = "rsi.decision.v1", "gc.output_json_required" = "true", "gc.rsi_authority_class" = "{{authority_class}}" }
description = """
Use the Go review finalizer for the independent judge lanes. Recompute the
story benchmark from the pinned suite and independently persisted traces,
then apply `internal/rsipolicy.Evaluate`. Reject missing or malformed evidence,
suite or bundle mismatch, any failed critical case, any story regression, or
no story improvement, regardless of aggregate quality score. Keep the current
bundle as the rollback bundle.

For evaluator, safety policy, clinical, deployment policy, or world-model
authority, stop at a human approval gate. This decision is not publication,
deployment, or a claim of clinical efficacy.
"""

[steps.retry]
max_attempts = 1
on_exhausted = "hard_fail"
